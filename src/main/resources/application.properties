spring.application.name=optin-backend

# Persistence adapter (ADR 0005): postgres (default, local/Podman) or firestore (GCP, profile "firestore").
optin.persistence=postgres

# PostgreSQL (see compose.yaml). Override the password with DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/optin
spring.datasource.username=optin
spring.datasource.password=${DB_PASSWORD:optin}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Secrets mounted as files in Kubernetes (GKE Secret Manager add-on). Each file name is a property
# name, e.g. /etc/optin/secrets/spring.datasource.password. Values imported here override this
# file. The directory doesn't exist locally, hence "optional".
spring.config.import=optional:configtree:/etc/optin/secrets/

# Actuator: only health over HTTP; liveness/readiness groups for Kubernetes probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Finish in-flight requests on SIGTERM (rolling updates, node upgrades).
server.shutdown=graceful
