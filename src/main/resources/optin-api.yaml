openapi: 3.1.0
info:
  title: Optin API
  version: 0.1.0
  description: Receivables opt-in service. A merchant grants a financial institution (grantee) an opt-in to view its receivables schedule.
servers:
  - url: /
paths:
  /opt-ins:
    post:
      operationId: createOptIn
      summary: Grant a new opt-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptInRequest'
      responses:
        '201':
          description: Opt-in created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptIn'
        '409':
          description: An ACTIVE opt-in already exists for this merchant and grantee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Business rule violated (for example, validUntil is not after today)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grantees/{grantee}/opt-ins:
    get:
      operationId: listOptInsByGrantee
      summary: List all opt-ins of a grantee
      parameters:
        - name: grantee
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Document'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Opt-ins of the grantee (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptIn'

  /merchants/{merchant}/opt-ins:
    get:
      operationId: listOptInsByMerchant
      summary: List all opt-ins of a merchant
      parameters:
        - name: merchant
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Document'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Opt-ins of the merchant (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptIn'

  /opt-ins/{id}/revoke:
    post:
      operationId: revokeOptIn
      summary: Revoke an opt-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Opt-in revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptIn'
        '404':
          description: Opt-in not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Opt-in is already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /opt-ins/validity-checks:
    post:
      operationId: checkOptInValidity
      summary: Revoke every ACTIVE opt-in whose validUntil has passed. Intended to be called once a day by a scheduler.
      responses:
        '200':
          description: Check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidityCheckResult'

components:
  parameters:
    StatusFilter:
      name: status
      in: query
      required: false
      description: Return only opt-ins with this status. Omit to return all statuses.
      schema:
        $ref: '#/components/schemas/OptInStatus'

  schemas:
    Document:
      type: string
      description: CNPJ, 14 digits, no punctuation
      pattern: '^[0-9]{14}$'

    Frequency:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]

    OptInStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    CreateOptInRequest:
      type: object
      required: [merchant, grantee, frequency, startDate, validUntil]
      additionalProperties: false
      properties:
        merchant:
          $ref: '#/components/schemas/Document'
        grantee:
          $ref: '#/components/schemas/Document'
        frequency:
          $ref: '#/components/schemas/Frequency'
        startDate:
          type: string
          format: date
        validUntil:
          type: string
          format: date

    OptIn:
      type: object
      required: [id, merchant, grantee, frequency, startDate, validUntil, status]
      properties:
        id:
          type: integer
          format: int32
        merchant:
          $ref: '#/components/schemas/Document'
        grantee:
          $ref: '#/components/schemas/Document'
        frequency:
          $ref: '#/components/schemas/Frequency'
        startDate:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/OptInStatus'
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: Set when status is REVOKED, null otherwise

    ValidityCheckResult:
      type: object
      required: [revokedCount]
      properties:
        revokedCount:
          type: integer
          format: int32
          description: Number of opt-ins revoked by this check

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
