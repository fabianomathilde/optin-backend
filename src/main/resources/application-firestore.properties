# Profile "firestore" (ADR 0005): the Firestore adapter replaces PostgreSQL.
optin.persistence=firestore

# GCP project and database. In GKE the project comes from the environment (config map);
# credentials come from Workload Identity (Application Default Credentials).
optin.firestore.project-id=${GOOGLE_CLOUD_PROJECT:}
optin.firestore.database-id=(default)

# Local runs against the emulator (compose.yaml): OPTIN_FIRESTORE_EMULATOR_HOST=localhost:8081
optin.firestore.emulator-host=

# No relational database in this profile: without a DataSource, JPA, Spring Data JPA and the
# JDBC health check back off too. Flyway is switched off explicitly.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false
