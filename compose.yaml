# Local development dependencies. Runs with podman compose (or docker compose).
#   podman compose up -d postgres     (default profile)
#   podman compose up -d firestore    (profile "firestore", see deploy/README.md)
#   podman compose down        (keeps data)
#   podman compose down -v     (removes data)
services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: optin-postgres
    environment:
      POSTGRES_DB: optin
      POSTGRES_USER: optin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optin}
    ports:
      - "5432:5432"
    volumes:
      - optin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optin -d optin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Firestore emulator for the "firestore" profile (ADR 0005). Data lives only while it runs.
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: optin-firestore
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8081"]
    ports:
      - "8081:8081"

volumes:
  optin-pgdata:
