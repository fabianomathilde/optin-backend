# Hostname for prod. Used only when the https-domain component is enabled in kustomization.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optin-backend
  namespace: optin-backend
  annotations:
    external-dns.alpha.kubernetes.io/hostname: optin.example.com
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: optin-backend-cert
  namespace: optin-backend
spec:
  domains:
    - optin.example.com
