# Mounts Secret Manager secrets as files (GKE Secret Manager add-on).
# The file names are Spring property names; the app loads them with
# spring.config.import=optional:configtree:/etc/optin/secrets/
# Overlays replace PROJECT_ID with the environment's project.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: optin-backend-secrets
  namespace: optin-backend
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/optin-backend-api-password/versions/latest"
        path: "spring.security.user.password"
